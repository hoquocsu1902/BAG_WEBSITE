<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chi Tiết Sản Phẩm – HUIT</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="stylesheet" href="assets/css/blue-theme.css">
</head>
<body>

  <div id="navbar-container"></div>

  <!-- Breadcrumb -->
  <div class="breadcrumb-section">
    <div class="container">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li id="productBreadcrumb" style="display:flex;align-items:center;gap:6px;list-style:none;font-size:0.82rem;color:var(--muted);">
            <a href="index.html" style="color:var(--muted);">Trang Chủ</a> /
            <a href="products.html" style="color:var(--muted);">Sản Phẩm</a>
          </li>
        </ol>
      </nav>
    </div>
  </div>

  <!-- Detail Content -->
  <div class="container section-padding">
    <div id="detailContent">
      <div class="spinner-wrapper"><div class="spinner-gold"></div></div>
    </div>
  </div>

  <!-- Reviews -->
  <section class="section-padding bg-cream">
    <div class="container">
      <div class="text-center mb-5">
        <div class="section-subtitle">Phản Hồi</div>
        <h2 class="section-title">Đánh Giá Khách Hàng</h2>
        <div class="section-divider"></div>
      </div>
      <div id="detailReviewSummary" class="review-summary mb-4"></div>
      <div class="row g-4" id="detailReviewList"></div>
    </div>
  </section>

  <!-- Related Products -->
  <section class="section-padding bg-light-custom" style="border-top:1px solid var(--border);">
    <div class="container">
      <div class="text-center mb-5">
        <div class="section-subtitle">Gợi Ý</div>
        <h2 class="section-title">Sản Phẩm Liên Quan</h2>
        <div class="section-divider"></div>
      </div>
      <div class="row g-4" id="relatedProducts"></div>
    </div>
  </section>

  <div id="footer-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/helpers.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/detail.js"></script>
  <script src="assets/js/reviews.js"></script>
  <script>
    renderNavbar('products');
    renderFooter();
  </script>
  <script src="assets/js/zoom.js"></script>
  <script src="assets/js/gemini-config.js"></script>
  <script src="assets/js/chatbot.js"></script>
</body>
</html>
