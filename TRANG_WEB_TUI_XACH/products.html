<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sản Phẩm – HUIT</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="stylesheet" href="assets/css/blue-theme.css">
</head>
<body>

  <div id="navbar-container"></div>

  <!-- Breadcrumb -->
  <div class="breadcrumb-section">
    <div class="container">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="index.html">Trang Chủ</a></li>
          <li class="breadcrumb-item active">Tất Cả Sản Phẩm</li>
        </ol>
      </nav>
    </div>
  </div>

  <!-- Page Header -->
  <div style="background:var(--cream);padding:40px 0;border-bottom:1px solid var(--border);">
    <div class="container text-center">
      <h1 style="font-family:var(--font-display);font-size:2.2rem;font-weight:400;">Bộ Sưu Tập Túi Xách</h1>
      <p style="color:var(--muted);font-size:0.88rem;margin-top:0.5rem;">Tìm kiếm chiếc túi hoàn hảo cho bạn</p>
    </div>
  </div>

  <div class="container py-5">
    <div class="row g-5">

      <!-- Sidebar Filters -->
      <div class="col-lg-3">
        <div class="filter-sidebar">

          <!-- Search -->
          <div class="mb-4">
            <div class="filter-title">Tìm Kiếm</div>
            <div class="search-bar">
              <input type="text" id="searchInput" placeholder="Tên sản phẩm...">
              <i class="bi bi-search search-icon"></i>
            </div>
          </div>

          <!-- Category Filter -->
          <div class="mb-4">
            <div class="filter-title">Danh Mục</div>
            <div>
              <div class="filter-option">
                <button data-category="all" class="btn p-0 border-0 active" style="font-size:0.88rem;background:none;width:100%;text-align:left;color:var(--primary);">Tất Cả Sản Phẩm</button>
              </div>
              <div class="filter-option">
                <button data-category="tote" class="btn p-0 border-0" style="font-size:0.88rem;background:none;width:100%;text-align:left;color:var(--primary);">Túi Tote</button>
              </div>
              <div class="filter-option">
                <button data-category="crossbody" class="btn p-0 border-0" style="font-size:0.88rem;background:none;width:100%;text-align:left;color:var(--primary);">Túi Đeo Chéo</button>
              </div>
              <div class="filter-option">
                <button data-category="office" class="btn p-0 border-0" style="font-size:0.88rem;background:none;width:100%;text-align:left;color:var(--primary);">Túi Công Sở</button>
              </div>
              <div class="filter-option">
                <button data-category="clutch" class="btn p-0 border-0" style="font-size:0.88rem;background:none;width:100%;text-align:left;color:var(--primary);">Clutch</button>
              </div>
              <div class="filter-option">
                <button data-category="backpack" class="btn p-0 border-0" style="font-size:0.88rem;background:none;width:100%;text-align:left;color:var(--primary);">Balo Mini</button>
              </div>
            </div>
          </div>

          <!-- Price Filter -->
          <div class="mb-4">
            <div class="filter-title">Khoảng Giá</div>
            <label class="filter-option">
              <input type="radio" name="priceRange" value="all" checked> Tất Cả
            </label>
            <label class="filter-option">
              <input type="radio" name="priceRange" value="under300"> Dưới 300.000đ
            </label>
            <label class="filter-option">
              <input type="radio" name="priceRange" value="300to500"> 300K – 500K
            </label>
            <label class="filter-option">
              <input type="radio" name="priceRange" value="over500"> Trên 500.000đ
            </label>
          </div>

          <!-- Reset -->
          <button onclick="resetFilters()" class="btn-dark-custom w-100 mt-2" style="padding:10px;">
            <i class="bi bi-arrow-counterclockwise me-2"></i>Xóa Bộ Lọc
          </button>
        </div>
      </div>

      <!-- Main Content -->
      <div class="col-lg-9">

        <!-- Top bar -->
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
          <div style="font-size:0.85rem;color:var(--muted);">
            Hiển thị <strong id="resultCount" style="color:var(--primary);">0</strong>
          </div>
          <div class="d-flex align-items-center gap-2">
            <span style="font-size:0.8rem;color:var(--muted);letter-spacing:0.1em;text-transform:uppercase;">Sắp xếp:</span>
            <select id="sortSelect" class="sort-select">
              <option value="default">Mặc định</option>
              <option value="price-asc">Giá tăng dần</option>
              <option value="price-desc">Giá giảm dần</option>
              <option value="new">Mới nhất</option>
              <option value="rating">Đánh giá cao</option>
            </select>
          </div>
        </div>

        <!-- Category buttons (quick filter) -->
        <div class="d-flex flex-wrap gap-2 mb-4">
          <button data-category="all" class="btn btn-sm active" style="border:1px solid var(--border);font-size:0.75rem;letter-spacing:0.1em;text-transform:uppercase;padding:6px 16px;border-radius:0;transition:all 0.3s;">Tất Cả</button>
          <button data-category="tote" class="btn btn-sm" style="border:1px solid var(--border);font-size:0.75rem;letter-spacing:0.1em;text-transform:uppercase;padding:6px 16px;border-radius:0;transition:all 0.3s;">Tote</button>
          <button data-category="crossbody" class="btn btn-sm" style="border:1px solid var(--border);font-size:0.75rem;letter-spacing:0.1em;text-transform:uppercase;padding:6px 16px;border-radius:0;transition:all 0.3s;">Đeo Chéo</button>
          <button data-category="office" class="btn btn-sm" style="border:1px solid var(--border);font-size:0.75rem;letter-spacing:0.1em;text-transform:uppercase;padding:6px 16px;border-radius:0;transition:all 0.3s;">Công Sở</button>
          <button data-category="clutch" class="btn btn-sm" style="border:1px solid var(--border);font-size:0.75rem;letter-spacing:0.1em;text-transform:uppercase;padding:6px 16px;border-radius:0;transition:all 0.3s;">Clutch</button>
          <button data-category="backpack" class="btn btn-sm" style="border:1px solid var(--border);font-size:0.75rem;letter-spacing:0.1em;text-transform:uppercase;padding:6px 16px;border-radius:0;transition:all 0.3s;">Balo</button>
        </div>

        <!-- Product Grid -->
        <div class="row" id="productGrid"></div>

        <!-- Empty State -->
        <div id="emptyState" style="display:none;" class="empty-state">
          <i class="bi bi-bag-x"></i>
          <h4>Không Tìm Thấy Sản Phẩm</h4>
          <p>Thử thay đổi bộ lọc hoặc từ khóa tìm kiếm</p>
          <button onclick="resetFilters()" class="btn-dark-custom mt-3" style="padding:12px 28px;">Xóa Bộ Lọc</button>
        </div>
      </div>
    </div>
  </div>

  <div id="footer-container"></div>

  <style>
    [data-category].active {
      background: var(--primary) !important;
      color: white !important;
      border-color: var(--primary) !important;
    }
    [data-category]:hover {
      border-color: var(--secondary) !important;
      color: var(--secondary) !important;
    }
    .filter-sidebar [data-category].active {
      color: var(--secondary) !important;
      background: none !important;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/helpers.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/products.js"></script>
  <script>
    renderNavbar('products');
    renderFooter();

    function resetFilters() {
      activeCategory = 'all';
      activePriceRange = 'all';
      activeSort = 'default';
      searchKeyword = '';

      document.querySelectorAll('[data-category]').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('[data-category="all"]').forEach(b => b.classList.add('active'));
      document.querySelectorAll('[name="priceRange"]')[0].checked = true;
      const sortEl = document.getElementById('sortSelect');
      if (sortEl) sortEl.value = 'default';
      const searchEl = document.getElementById('searchInput');
      if (searchEl) searchEl.value = '';

      renderProducts();
    }
  </script>
  <script src="assets/js/gemini-config.js"></script>
  <script src="assets/js/chatbot.js"></script>
</body>
</html>
