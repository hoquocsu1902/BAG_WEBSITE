<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yêu Thích – HUIT</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="stylesheet" href="assets/css/blue-theme.css">
</head>
<body>

  <div id="navbar-container"></div>

  <div class="breadcrumb-section">
    <div class="container">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="index.html">Trang Chủ</a></li>
          <li class="breadcrumb-item active">Yêu Thích</li>
        </ol>
      </nav>
    </div>
  </div>

  <div style="background:var(--cream);padding:40px 0;border-bottom:1px solid var(--border);">
    <div class="container">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
        <div>
          <h1 style="font-family:var(--font-display);font-size:2rem;font-weight:400;margin-bottom:0.2rem;">
            <i class="bi bi-heart-fill me-3" style="color:var(--secondary);font-size:1.6rem;"></i>Yêu Thích
          </h1>
          <p style="color:var(--muted);font-size:0.85rem;"><span id="wishlistCount">0</span> sản phẩm</p>
        </div>
        <div class="d-flex gap-2 flex-wrap">
          <button onclick="addAllToCart()" class="btn-dark-custom" style="padding:10px 20px;font-size:0.78rem;">
            <i class="bi bi-bag me-2"></i>Thêm Tất Cả Vào Giỏ
          </button>
          <button onclick="clearWishlist()" style="background:none;border:1px solid var(--border);padding:10px 20px;font-size:0.78rem;cursor:pointer;letter-spacing:0.1em;font-family:var(--font-body);transition:all 0.3s;" onmouseover="this.style.borderColor='var(--danger)';this.style.color='var(--danger)'" onmouseout="this.style.borderColor='var(--border)';this.style.color='inherit'">
            <i class="bi bi-trash me-2"></i>Xóa Tất Cả
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="container section-padding">
    <!-- Empty State -->
    <div id="wishlistEmpty" style="display:none;" class="empty-state">
      <i class="bi bi-heart"></i>
      <h4>Chưa Có Sản Phẩm Yêu Thích</h4>
      <p>Thêm sản phẩm vào yêu thích để lưu lại những chiếc túi bạn thích</p>
      <a href="products.html" class="btn-primary-custom mt-3" style="display:inline-flex;">
        <i class="bi bi-bag me-2"></i>Khám Phá Sản Phẩm
      </a>
    </div>

    <!-- Wishlist Grid -->
    <div class="row g-4" id="wishlistGrid"></div>
  </div>

  <div id="footer-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/helpers.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/wishlist.js"></script>
  <script>
    renderNavbar('wishlist');
    renderFooter();
  </script>
  <script src="assets/js/gemini-config.js"></script>
  <script src="assets/js/chatbot.js"></script>
</body>
</html>
